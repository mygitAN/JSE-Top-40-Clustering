name: Validate research pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run nine combinations and five seeds on all dates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.runtime/matplotlib
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.runtime/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate_data.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - if: ${{ !inputs.full_suite }}
        run: python scripts/run_analysis.py --output outputs/ci --mode baseline --stability-runs 2
      - if: ${{ inputs.full_suite }}
        run: python scripts/run_analysis.py --output outputs/ci --mode full --stability-runs 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/ci/
