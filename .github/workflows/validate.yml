name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Input validation needs no third-party package, so it runs first.
      - run: python -m top40.data
      # The committed results must be exactly what was exported from their run.
      - run: python -m top40.export --check
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m top40 --output outputs/ci --run-id ci --stability-runs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/ci/runs/ci/
